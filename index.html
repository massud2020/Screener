<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Balanced Screener</title>
<style>
:root{--bg:#08090b;--card:#111318;--bd:#23262d;--tx:#e8eaed;--mu:#8a8f98;--g:#3f9d6a;--r:#d15a52}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:2}h1{font-size:18px}
.bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}button,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font:inherit}
button.p{background:var(--g);border-color:var(--g);color:#fff}.st{color:var(--mu);font-size:12px;margin-top:6px}
.set{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}.set.on{display:block}
.set label{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center}.sym{font-weight:600;direction:ltr}
.b{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.LONG{background:var(--g)}.SHORT{background:var(--r)}.NONE{background:var(--bd);color:var(--mu)}
.d{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:13px;direction:ltr;color:var(--mu)}.d b{color:var(--tx);font-weight:500}
.lv{color:#35e07b;font-size:11px;font-weight:700;margin-inline-start:6px;animation:pl 1.2s ease-in-out infinite}
.mn{color:var(--mu);font-size:11px;margin:0 8px;font-weight:400}.bn{display:none;background:#14231b;border:1px solid #2f7a52;border-radius:14px;padding:9px 11px;margin-top:8px;font-size:13px}.bn.on{display:block}.bi{padding:6px 0;border-top:1px solid #21402f;cursor:pointer;direction:ltr}.bi:first-of-type{margin-top:6px}
.f{color:var(--mu);font-size:12px;margin-top:4px}
.ld{display:none;align-items:center;gap:14px;background:linear-gradient(135deg,#0f1713,#111318);border:1px solid #1f3a2b;border-radius:16px;padding:12px 14px;margin-top:8px;box-shadow:0 0 24px rgba(53,224,123,.08)}.ld.on{display:flex}
.rd{width:54px;height:54px;border-radius:50%;position:relative;flex:none;overflow:hidden;border:1px solid #2a5a3f;background:radial-gradient(circle,#35e07b 0 2px,transparent 3px),repeating-radial-gradient(circle,#1a3a29 0 1px,transparent 1px 13px),#0a110d}
.rd:before,.rd:after{content:"";position:absolute;background:#1a3a29}.rd:before{left:50%;top:0;bottom:0;width:1px}.rd:after{top:50%;left:0;right:0;height:1px}
.rd i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(53,224,123,.75),rgba(53,224,123,0) 75deg,transparent 0);animation:sp 1.3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@keyframes pl{50%{opacity:.45}}
.lt{flex:1;min-width:0}.lt b{font-size:17px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.lt span{display:block;color:var(--mu);font-size:12px;margin-top:2px;direction:ltr;text-align:right;animation:pl 1.4s ease-in-out infinite}
.pb{height:7px;border-radius:99px;background:#1c1f26;overflow:hidden;margin-top:9px;position:relative}.pb u{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2f8a5a,#35e07b);transition:width .25s;position:relative;overflow:hidden}
.pb u:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sh 1.1s linear infinite}
</style></head><body>
<header><h1>Balanced Screener <small id="ver" style="color:var(--mu);font-size:11px;font-weight:400"></small></h1>
<div class="bar"><button class="p" id="go">اسکن</button><select id="mode"><option value="pullback">پولبک EMA</option><option value="pattern">الگوی ۳+۱</option><option value="fvg">Daily Open + Sweep + MSS + FVG</option><option value="all">همه استراتژی‌ها (هر سه)</option></select><button id="gs">تنظیمات</button></div>
<div class="set" id="set"><label>فیلتر M15<input type="checkbox" id="m15" checked></label><label>فیلتر H1<input type="checkbox" id="h1" checked></label><label>H1 سخت‌گیرانه<input type="checkbox" id="h1s"></label><label>فقط سیگنال‌دارها<input type="checkbox" id="only"></label><label>OANDA توکن<input type="password" id="tok" placeholder="API token" style="width:55%;direction:ltr;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px"></label><label>نوع حساب OANDA<select id="env"><option value="practice">Practice</option><option value="live">Live</option></select></label><label>سهام اضافه<input id="ex" placeholder="مثلاً SHOP, UBER" style="width:55%;direction:ltr;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px"></label><label>اعلان صدا و سیستمی<button id="nt" style="padding:5px 12px">فعال‌سازی</button></label><label>اعلام صوتی نام نماد<input type="checkbox" id="sp" checked></label><label>اسکن خودکار (۶۰ثانیه)<input type="checkbox" id="auto"></label></div>
<div class="ld" id="ld"><div class="rd"><i></i></div><div class="lt"><b id="lp">0 / 0</b><span id="ls">در حال دریافت داده…</span><div class="pb"><u id="lb"></u></div></div></div>
<div class="bn" id="bn"></div>
<div class="st" id="st">آماده</div></header>
<main id="list"></main>
<div id="ov" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px 16px;direction:ltr"><div class="top" style="margin-bottom:8px"><div><b id="ct"></b> <span class="lv">● LIVE</span></div><button id="cx">✕ بستن</button></div><div><canvas id="cv"></canvas></div><div class="st" id="ci" style="direction:rtl;line-height:1.7"></div></div>
<script src="symbols.js?v=19"></script><script src="engine.js?v=19"></script><script src="chart.js?v=19"></script>
<script>
const BUILD=19,MISS=[typeof U==="undefined"?"symbols.js":0,typeof evalFvg==="undefined"?"engine.js":0,typeof drawChart==="undefined"?"chart.js":0].filter(Boolean);
const $=i=>document.getElementById(i);let timer=null,busy=false;const D={},MN={pullback:"پولبک",pattern:"۳+۱",fvg:"FVG"};
const PROX=[u=>u,u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)];
async function J(url,prox){let e;for(const p of prox?PROX:[PROX[0]]){try{const r=await fetch(p(url),{signal:AbortSignal.timeout(12000)});if(r.ok)return await r.json()}catch(x){e=x}}throw e||new Error("fetch")}
async function okx(id,bar){const j=await J(`https://www.okx.com/api/v5/market/candles?instId=${id}&bar=${bar}&limit=300`,false);if(j.code!=="0")return[];return j.data.map(r=>({time:+r[0]/1000,open:+r[1],high:+r[2],low:+r[3],close:+r[4]})).sort((a,b)=>a.time-b.time)}
async function yh(s,iv,rg){const j=await J(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(s)}?interval=${iv}&range=${rg}&includePrePost=false`,true);const r=j.chart.result[0],q=r.indicators.quote[0],o=[];(r.timestamp||[]).forEach((t,i)=>{if(q.open[i]!=null&&q.high[i]!=null&&q.low[i]!=null&&q.close[i]!=null)o.push({time:t,open:q.open[i],high:q.high[i],low:q.low[i],close:q.close[i]})});return o}
async function oanda(inst,g){const t=localStorage.getItem("bs_tok"),h=localStorage.getItem("bs_env")==="live"?"api-fxtrade":"api-fxpractice";const r=await fetch(`https://${h}.oanda.com/v3/instruments/${inst}/candles?granularity=${g}&count=300&price=M`,{headers:{Authorization:"Bearer "+t},signal:AbortSignal.timeout(12000)});if(!r.ok)throw new Error("OANDA "+r.status);const j=await r.json();return j.candles.map(c=>({time:Date.parse(c.time)/1000,open:+c.mid.o,high:+c.mid.h,low:+c.mid.l,close:+c.mid.c})).filter(c=>isFinite(c.close))}
async function load(u){let a=[],h=[];
if(u[1]){try{[a,h]=await Promise.all([okx(u[1],"5m"),okx(u[1],"1H")])}catch(e){}}
else if(u[4]&&localStorage.getItem("bs_tok")){try{[a,h]=await Promise.all([oanda(u[4],"M5"),oanda(u[4],"H1")])}catch(e){}}
if((a.length<210||h.length<210)&&u[2]){const[x,y]=await Promise.all([yh(u[2],"5m","5d"),yh(u[2],"1h","6mo")]);if(x.length>a.length)a=x;if(y.length>h.length)h=y}return[a,h]}
function S(){return{mode:$("mode").value,m15:$("m15").checked,h1:$("h1").checked,h1Strict:$("h1s").checked}}
async function scan(){if(busy)return;busy=true;$("go").disabled=true;$("st").textContent="در حال اسکن…";const L=U.concat((localStorage.getItem("bs_ex")||"").split(/[ ,]+/).filter(Boolean).map(t=>[t.toUpperCase(),0,t.toUpperCase(),2,0]));const rows=[],errs=[];let i=0,dn=0;const fa=n=>n.toLocaleString("fa-IR"),prog=n=>{$("lb").style.width=(dn/L.length*100)+"%";$("lp").textContent=fa(dn)+" / "+fa(L.length);$("ls").textContent=n};$("ld").classList.add("on");prog("در حال دریافت داده…");
await Promise.all(Array.from({length:5},async()=>{while(i<L.length){const u=L[i++];try{const[a,h]=await load(u);if(a.length<50)throw 0;D[u[0]]={id:u[0],a,h,dg:u[3],u};const ms=S().mode==="all"?["pullback","pattern","fvg"]:[S().mode],rs=ms.map(m=>{const r=evaluate(u[0],a,h,{...S(),mode:m});r.d=u[3];r.mode=m;return r}),sg=rs.filter(r=>r.side);(sg.length?sg:[rs[0]]).forEach(r=>rows.push(r))}catch(e){errs.push(u[0])}dn++;prog(u[0])}}));
const rk=r=>r.side==="LONG"?0:r.side==="SHORT"?1:2;rows.sort((a,b)=>rk(a)-rk(b)||a.id.localeCompare(b.id));
const ns=Date.now()/1000;let seen={};try{seen=JSON.parse(localStorage.getItem("bs_seen")||"{}")}catch(e){}const fr=[];
rows.forEach(r=>{if(!r.side)return;const cl=dropForming(D[r.id].a,300,ns),bt=cl.length?cl[cl.length-1].time:0;if(ns-(bt+300)>1200)return;const k=r.id+"|"+r.mode+"|"+r.side+"|"+bt;if(seen[k])return;seen[k]=ns;fr.push(r)});
Object.keys(seen).forEach(k=>{if(ns-seen[k]>86400)delete seen[k]});try{localStorage.setItem("bs_seen",JSON.stringify(seen))}catch(e){}window.__fresh=fr.length;if(fr.length)alertNow(fr);
const only=$("only").checked,vis=only?rows.filter(r=>r.side):rows,n=rows.filter(r=>r.side).length;
$("list").innerHTML=vis.map(r=>`<div class="row" data-id="${r.id}" data-mode="${r.mode}" style="cursor:pointer"><div class="top"><span><span class="sym">${r.id}</span>${r.side||S().mode!=="all"?`<span class="mn">${MN[r.mode]}</span>`:""}</span><span class="b ${r.side||"NONE"}">${r.side||"—"}</span></div>${r.side?`<div class="d"><span>Entry <b>${r.entry.toFixed(r.d)}</b></span><span>SL <b>${r.sl.toFixed(r.d)}</b></span><span>RSI <b>${r.rsi.toFixed(1)}</b></span>${r.tp!=null?`<span>TP <b>${r.tp.toFixed(r.d)}</b> · RR <b>${r.rr.toFixed(1)}</b></span>`:`<span>Exit <b>اولین واگرایی RSI</b></span>`}</div>`:`<div class="f">${r.fail||""}${r.rsi?" · RSI "+r.rsi.toFixed(1):""}</div>`}</div>`).join("")||'<div class="f">نتیجه‌ای نیست</div>';
$("st").textContent=`${n} سیگنال از ${rows.length} نماد · ${new Date().toLocaleTimeString("fa-IR")}`+(errs.length?` · خطا: ${errs.join(", ")}`:"");
$("ld").classList.remove("on");busy=false;$("go").disabled=false}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type="sine";g.gain.value=.25;[880,1175,880,1175].forEach((f,i)=>o.frequency.setValueAtTime(f,a.currentTime+i*.18));o.start();o.stop(a.currentTime+.75)}catch(e){}}
const BL=[];
function banner(fr){fr.forEach(r=>BL.unshift({id:r.id,mode:r.mode,side:r.side,t:new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})}));BL.length=Math.min(BL.length,40);
$("bn").innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b>🔔 سیگنال جدید</b><button id="bx" style="padding:2px 9px">✕</button></div>'+BL.slice(0,6).map(x=>`<div class="bi" data-id="${x.id}" data-mode="${x.mode}">${x.side==="LONG"?"🟢":"🔴"} <b>${x.id}</b> ${x.side} <span class="mn">${MN[x.mode]} · ${x.t}</span></div>`).join("")+(BL.length>6?`<div class="f" style="margin-top:6px">+${BL.length-6} سیگنال دیگر؛ لیست پایین را ببینید</div>`:"");$("bn").classList.add("on");$("bx").onclick=()=>{BL.length=0;$("bn").classList.remove("on")}}
function say(fr){if(!$("sp").checked||!window.speechSynthesis)return;try{const seen=new Set(),uq=fr.filter(r=>{const k=r.id+r.side;if(seen.has(k))return false;seen.add(k);return true}),t=uq.slice(0,3).map(r=>(r.side==="LONG"?"long ":"short ")+r.id.replace(/USDT$|USD$/,"").split("").join(" ")).join(". ")+(uq.length>3?". and "+(uq.length-3)+" more":""),u=new SpeechSynthesisUtterance("New signal. "+t);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function alertNow(fr){beep();banner(fr);say(fr);try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400])}catch(e){}
if(window.Notification&&Notification.permission==="granted"&&navigator.serviceWorker){navigator.serviceWorker.ready.then(g=>fr.slice(0,5).forEach(r=>g.showNotification((r.side==="LONG"?"🟢 LONG ":"🔴 SHORT ")+r.id+" · "+MN[r.mode],{body:`Entry ${r.entry.toFixed(r.d)} | SL ${r.sl.toFixed(r.d)}`,icon:"icon-192.png",tag:"s-"+r.id,requireInteraction:true}))).catch(()=>{})}}
$("bn").onclick=e=>{const w=e.target.closest(".bi");if(w&&D[w.dataset.id])openChart(w.dataset.id,w.dataset.mode)};
$("sp").checked=localStorage.getItem("bs_sp")!=="false";$("sp").onchange=()=>localStorage.setItem("bs_sp",$("sp").checked);
$("nt").onclick=async()=>{beep();try{const p=await Notification.requestPermission();$("nt").textContent=p==="granted"?"فعال ✓":"رد شد"}catch(e){$("nt").textContent="پشتیبانی نمی‌شود"}};
if(window.Notification&&Notification.permission==="granted")$("nt").textContent="فعال ✓";
$("go").onclick=scan;
let liveT=null,liveId=null,liveBusy=false,lastH1=0,curMode=null;const SM=()=>({...S(),mode:curMode||S().mode});
async function fetchTF(u,tf){const m=tf==="5m";if(u[1])return okx(u[1],m?"5m":"1H");if(u[4]&&localStorage.getItem("bs_tok")){try{return await oanda(u[4],m?"M5":"H1")}catch(e){}}return u[2]?yh(u[2],m?"5m":"1h",m?"5d":"6mo"):[]}
function render(id){const d=D[id],x=drawChart($("cv"),d,SM(),Date.now()/1000),r=x.row;
$("ci").textContent=`● زنده · ${new Date().toLocaleTimeString("fa-IR")} · قیمت ${x.price.toFixed(d.dg)} · `+(r.side?`${r.side} · Entry ${r.entry.toFixed(d.dg)} · SL ${r.sl.toFixed(d.dg)} `+(r.tp!=null?` · TP ${r.tp.toFixed(d.dg)} (RR ${r.rr.toFixed(1)})`:" · خروج: اولین واگرایی RSI"):`سیگنال فعلی ندارد (${r.fail||"-"})`)+` · سیگنال‌های بسته‌شده اخیر: ${x.n} · سبز EMA21، صورتی EMA50، قرمز EMA200، ▲▼ ورود، ● خروج`+(curMode==="fvg"?" · DO نارنجی، FVG آبی، MSS بنفش، SWEEP دایره سفید":"")}
async function tick(){if(!liveId||document.hidden||liveBusy)return;liveBusy=true;const id=liveId,d=D[id];try{const a=await fetchTF(d.u,"5m");if(a.length>=210&&id===liveId)d.a=a;if(Date.now()-lastH1>60000){const h=await fetchTF(d.u,"1h");if(h.length>=210)d.h=h;lastH1=Date.now()}if(id===liveId)render(id)}catch(e){}liveBusy=false}
function openChart(id,mode){curMode=mode||(S().mode==="all"?"pullback":S().mode);$("ov").style.display="block";$("ct").textContent=id+" · "+({pullback:"پولبک EMA",pattern:"الگوی ۳+۱",fvg:"Sweep+MSS+FVG"})[curMode];render(id);liveId=id;lastH1=Date.now();clearInterval(liveT);liveT=setInterval(tick,D[id].u[1]?5000:15000);tick()}
function closeChart(){clearInterval(liveT);liveT=null;liveId=null;curMode=null;$("ov").style.display="none"}
$("list").onclick=e=>{const w=e.target.closest(".row");if(w&&D[w.dataset.id])openChart(w.dataset.id,w.dataset.mode)};$("cx").onclick=closeChart;
$("gs").onclick=()=>$("set").classList.toggle("on");
["mode","m15","h1","h1s","only"].forEach(i=>$(i).onchange=()=>{localStorage.setItem("bs_"+i,$(i).type==="checkbox"?$(i).checked:$(i).value);scan()});
$("auto").onchange=()=>{clearInterval(timer);try{localStorage.setItem("bs_auto",$("auto").checked)}catch(e){}if($("auto").checked)timer=setInterval(scan,60000)};try{$("auto").checked=localStorage.getItem("bs_auto")!=="false"}catch(e){}if($("auto").checked)timer=setInterval(scan,60000);
$("ex").value=localStorage.getItem("bs_ex")||"";$("ex").onchange=()=>{localStorage.setItem("bs_ex",$("ex").value.trim());scan()};$("tok").value=localStorage.getItem("bs_tok")||"";$("env").value=localStorage.getItem("bs_env")||"practice";
$("tok").onchange=()=>{localStorage.setItem("bs_tok",$("tok").value.trim());scan()};$("env").onchange=()=>{localStorage.setItem("bs_env",$("env").value);scan()};
try{["mode","m15","h1","h1s","only"].forEach(i=>{const v=localStorage.getItem("bs_"+i);if(v!=null){$(i).type==="checkbox"?$(i).checked=v==="true":$(i).value=v}})}catch(e){}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
document.getElementById("ver").textContent="v"+BUILD;
if(MISS.length){document.getElementById("st").innerHTML='<span style="color:#ff6b6b">⚠ این فایل‌ها قدیمی یا آپلودنشده‌اند: '+MISS.join("، ")+' — آپلود کنید و چند بار رفرش کنید</span>'}else scan();
</script></body></html>
