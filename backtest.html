<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d11">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>بک‌تست · Screener</title>
<style>
:root{--bg:#0b0d11;--card:#12151b;--card2:#171b22;--bd:#232830;--bd2:#1b1f27;--tx:#e6e9ee;--tx2:#a7aebb;--mu:#78808d;--g:#2e9a69;--gb:#46c58c;--gd:rgba(47,157,104,.14);--r:#d4524c;--rb:#e8736d;--rs:12px;--rad:16px;--font:"Segoe UI",system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 var(--font);min-height:100dvh;padding:0 14px calc(env(safe-area-inset-bottom) + 40px);-webkit-font-smoothing:antialiased}
bdi{unicode-bidi:isolate}
button,select,input{font:inherit;color:var(--tx)}
button,a.btn{color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:0 14px;min-height:44px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gb);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,11,14,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}.brand i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#1f6f47,var(--gb));font-style:normal;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:14px;margin-top:14px}
h2{font-size:15px;margin-bottom:6px}h3{font-size:12px;color:var(--mu);font-weight:600;margin:14px 0 4px;letter-spacing:.03em}
.hint{color:var(--mu);font-size:12.5px;line-height:1.8}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px dashed #2c4a3a;border-radius:var(--rs);padding:18px 12px;margin-top:10px;cursor:pointer;background:rgba(61,202,133,.04)}.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}.drop b{color:var(--gb)}.drop span{color:var(--mu);font-size:12px}
.ds{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd2)}.ds:first-child{border-top:none}
.ds .nm{flex:1;min-width:0}.ds .nm b{direction:ltr;display:inline-block}.ds .nm small{display:block;color:var(--mu);font-size:11.5px;direction:ltr;text-align:right}
.ds button{min-height:34px;padding:0 10px;font-size:13px;color:var(--rb)}
.msg{font-size:12.5px;margin-top:8px;color:var(--tx2)}.msg.err{color:var(--rb)}.msg.ok{color:var(--gb)}
details.guide{margin-top:12px;border:1px solid var(--bd2);border-radius:var(--rs);padding:0 12px}
details.guide summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--tx2);font-size:13.5px}
details.guide ol,details.guide ul{margin:0 18px 10px 0;color:var(--tx2);font-size:13px;line-height:1.9}
details.guide code{direction:ltr;unicode-bidi:isolate;background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:1px 6px;font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mu)}
.fld input,.fld select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:0 11px;min-height:42px;font-size:14px;color:var(--tx);direction:ltr;text-align:right;width:100%}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid var(--bd2);font-size:14px;color:var(--tx2)}.sw:last-child{border-bottom:none}
.sw small{display:block;color:var(--mu);font-size:11.5px}
.sw input{-webkit-appearance:none;appearance:none;flex:none;width:44px;height:26px;border-radius:99px;background:#2a2e37;position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#cfd3da;transition:inset-inline-start .2s}
.sw input:checked{background:var(--g)}.sw input:checked::after{inset-inline-start:21px;background:#fff}
button.p{position:relative;overflow:hidden;background:linear-gradient(120deg,#1f8f5f 0%,#33b57f 48%,#2aa9a0 100%);border:none;color:#fff;font-weight:800;width:100%;min-height:54px;font-size:15.5px;margin-top:14px;letter-spacing:.01em;box-shadow:0 6px 22px rgba(51,181,127,.28),inset 0 1px 0 rgba(255,255,255,.18)}
button.p::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.8s ease-in-out infinite}
button.p:disabled::after{animation:none;opacity:0}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.prog{display:none;margin-top:12px}.prog.on{display:block}
.pb{height:6px;border-radius:99px;background:#1a1d24;overflow:hidden;margin-top:8px}.pb u{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a8f5c,var(--gb));transition:width .2s}
.pt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);gap:8px}
.sc{border:1px solid var(--bd);border-radius:var(--rad);background:var(--card);padding:14px;margin-top:14px;position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--c)}
.sc h4{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}.sc h4 small{font-size:11.5px;color:var(--mu);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;direction:ltr}
.kv div{background:var(--bg);border:1px solid var(--bd2);border-radius:10px;padding:7px 9px;min-width:0}
.kv i{display:block;font-style:normal;font-size:10.5px;color:var(--mu);letter-spacing:.04em;text-transform:uppercase;direction:rtl;text-align:right}
.kv b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}.pos{color:var(--gb)}.neg{color:var(--rb)}
.split{margin-top:10px;font-size:12px;color:var(--tx2);display:grid;gap:4px}.split div{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;padding:6px 10px}
.warn{margin-top:10px;font-size:12px;color:#ffb020;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.25);border-radius:10px;padding:7px 10px}
canvas{width:100%;border-radius:var(--rad);display:block;border:1px solid var(--bd)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--mu)}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;background:var(--c)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd2);border-radius:99px;padding:3px;margin:12px 0 4px}.seg button{border:none;background:transparent;min-height:34px;border-radius:99px;font-size:12.5px;padding:0 13px;color:var(--mu)}.seg button.on{background:var(--card2);color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:12.5px;direction:ltr;margin-top:8px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd2);text-align:right;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.note{margin-top:16px;font-size:12px;color:var(--mu);line-height:1.9;border-top:1px solid var(--bd2);padding-top:12px}
/* metric tiles */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.m{position:relative;border:1px solid var(--bd2);border-radius:14px;padding:10px 11px;background:var(--bg);min-width:0;overflow:hidden}
.m .mh{display:flex;align-items:center;gap:6px;color:var(--mu)}.m .mh i{font-style:normal;font-size:11.5px;line-height:1.3}
.m .ic{width:16px;height:16px;flex:none}
.m b{display:block;margin-top:6px;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;text-align:right}
.m.big b{font-size:25px;letter-spacing:-.01em;margin-top:8px}
.m .sub{display:block;font-size:11.5px;color:var(--tx2);margin-top:2px;direction:ltr;text-align:right}
.m .pbar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden;direction:ltr}.m .pbar u{display:block;height:100%;background:currentColor;border-radius:99px}
.t-pos{background:linear-gradient(135deg,rgba(70,197,140,.20),rgba(70,197,140,.04) 75%),var(--bg);border-color:rgba(70,197,140,.32)}.t-pos .mh{color:#7fdcb1}.t-pos b,.t-pos .pbar{color:var(--gb)}
.t-neg{background:linear-gradient(135deg,rgba(232,115,109,.20),rgba(232,115,109,.04) 75%),var(--bg);border-color:rgba(232,115,109,.32)}.t-neg .mh{color:#f0a09b}.t-neg b,.t-neg .pbar{color:var(--rb)}
.t-warn{background:linear-gradient(135deg,rgba(255,176,32,.17),rgba(255,176,32,.04) 75%),var(--bg);border-color:rgba(255,176,32,.3)}.t-warn .mh{color:#ffc766}.t-warn b,.t-warn .pbar{color:#ffb020}
.t-soft{background:linear-gradient(135deg,rgba(232,115,109,.09),rgba(232,115,109,.01) 75%),var(--bg);border-color:rgba(232,115,109,.18)}.t-soft b{color:var(--rb)}
.sy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.sy{border:1px solid var(--bd2);border-radius:14px;padding:10px 11px;background:var(--bg);min-width:0}.sy.w{border-color:rgba(70,197,140,.3);background:linear-gradient(135deg,rgba(70,197,140,.09),transparent 70%),var(--bg)}.sy.l{border-color:rgba(232,115,109,.28);background:linear-gradient(135deg,rgba(232,115,109,.09),transparent 70%),var(--bg)}
.sy .sh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.sy .sh b{direction:ltr}.sy .sh span{color:var(--mu);font-size:11px}
.sy .sg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:8px;direction:ltr}.sy .sg i{display:block;font-style:normal;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}.sy .sg b{font-size:13px;font-variant-numeric:tabular-nums}
/* trade cards */
.th2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}
.seg.sm{margin:0}.seg.sm button{min-height:30px;font-size:12px;padding:0 11px}
.tl{display:grid;gap:10px;margin-top:10px}
.tc{border-radius:14px;padding:11px 12px;border:1.5px solid var(--bd);background:var(--card);animation:up .22s ease both}
.tc.w{border-color:rgba(70,197,140,.6);background:linear-gradient(135deg,rgba(70,197,140,.08),transparent 60%),var(--card)}
.tc.l{border-color:rgba(232,115,109,.6);background:linear-gradient(135deg,rgba(232,115,109,.08),transparent 60%),var(--card)}
.tc .th{display:flex;justify-content:space-between;align-items:center;gap:8px}.tc .tid{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tc .tid b{direction:ltr;font-size:15px}
.tc .tr{font-size:18px;font-variant-numeric:tabular-nums;direction:ltr}
.chip{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.chip.cl{color:var(--gb);border-color:rgba(70,197,140,.35);background:rgba(70,197,140,.1)}.chip.cs{color:var(--rb);border-color:rgba(232,115,109,.35);background:rgba(232,115,109,.1)}.chip.cx{color:#ffb020;border-color:rgba(255,176,32,.35)}
.chip.why.TP{color:var(--gb)}.chip.why.SL{color:var(--rb)}.chip.why.RSI{color:#6db4ff}.chip.why.CLOSE{color:#ffb020}
.tc .tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;direction:ltr}
.tc .tg div{background:rgba(0,0,0,.22);border-radius:10px;padding:7px 9px;min-width:0}.tc .tg i{display:block;font-style:normal;font-size:10px;color:var(--mu);letter-spacing:.05em;text-transform:uppercase}.tc .tg b{display:block;font-size:14px;font-variant-numeric:tabular-nums}.tc .tg small{display:block;color:var(--mu);font-size:10.5px;margin-top:1px}
.tc .tf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:9px;font-size:12px;color:var(--mu);direction:ltr}
.more{width:100%;margin-top:12px}
.csv{width:100%;margin-top:12px;min-height:48px;transition:background .2s,border-color .2s,color .2s}
.csv.busy{color:var(--tx2)}.csv.ok{background:rgba(70,197,140,.14);border-color:var(--gb);color:var(--gb)}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.22);border-top-color:var(--gb);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.chk{width:18px;height:18px;stroke-dasharray:24;stroke-dashoffset:24;animation:dr .35s .05s ease forwards}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* toasts */
#toasts{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:430px;background:rgba(23,27,34,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-inline-start:4px solid var(--mu);border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.6;box-shadow:0 12px 32px rgba(0,0,0,.55);transform:translateY(18px);opacity:0;transition:transform .25s,opacity .25s;cursor:pointer}
.toast.in{transform:none;opacity:1}.toast.success{border-inline-start-color:var(--gb)}.toast.error{border-inline-start-color:var(--rb)}.toast.info{border-inline-start-color:#4aa3ff}
.toast .ti{flex:none;display:grid;place-items:center;width:20px;height:20px}.toast.success .ti{color:var(--gb)}.toast.error .ti{color:var(--rb)}.toast.info .ti{color:#6db4ff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="brand"><i>📊</i><div>بک‌تست <small id="bv" style="color:var(--mu);font-size:11px;font-weight:500">v29</small></div></div><a
